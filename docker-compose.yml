services:
  middleware_sincrono:
    build: ./Middleware_Sincrono
    container_name: middleware_sincrono
    ports:
      - "8004:8000"
    environment:
      CATALOGO_URL: http://catalogo:8000
      PEDIDOS_URL: http://pedidos:8000
      PAGAMENTO_URL: http://pagamentos:8000
      REQUEST_TIMEOUT: "5"
    depends_on:
      - catalogo
      - pedidos
      - pagamentos
    networks:
      - rede_catalogo
      - rede_pedidos
      - rede_pagamentos

  middleware:
    build: ./Middleware
    container_name: middleware
    ports:
      - "8000:8000"
    environment:
      CATALOGO_URL: http://catalogo:8000
      PEDIDOS_URL: http://pedidos:8000
      PAGAMENTOS_URL: http://pagamentos:8000
      BROKER_URL: amqp://app:senha_dev_123@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalogo:
        condition: service_started
      pedidos:
        condition: service_started
      pagamentos:
        condition: service_started
    networks:
      - rede_catalogo
      - rede_pedidos
      - rede_pagamentos

  rabbitmq:
    image: rabbitmq:4-management
    container_name: message_broker
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: senha_dev_123
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rede_catalogo
      - rede_pedidos
      - rede_pagamentos
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogo:
    build: ./Servicos/Catalogo
    container_name: servico_catalogo
    ports:
      - "8001:8000"
    environment:
      CATALOGO_DELAY_SECONDS: ${CATALOGO_DELAY_SECONDS:-0}
    networks:
      - rede_catalogo

  pedidos:
    build: ./Servicos/Pedidos
    container_name: servico_pedidos
    ports:
      - "8002:8000"
    environment:
      CATALOGO_URL: http://catalogo:8000
      CATALOGO_TIMEOUT_SECONDS: ${CATALOGO_TIMEOUT_SECONDS:-3}
    depends_on:
      - catalogo
    networks:
      - rede_pedidos
      - rede_catalogo


  pagamento:
    build: ./Servicos/Pagamentos
  pagamentos:
    build: ./Servicos/pagamentos
    container_name: servico_pagamento
    ports:
      - "8003:8000"
    networks:
      - rede_pagamentos


networks:
  rede_catalogo:
  rede_pedidos:
  rede_pagamentos:
