
services:

  catalogo:
    build: ./Servicos/catalogo
    container_name: servico_catalogo
    ports:
      - "8001:8000"
    networks:
      - rede_catalogo

  pedidos:
    build: ./Servicos/pedidos
    container_name: servico_pedidos
    ports:
      - "8002:8000"
    networks:
      - rede_pedidos

  pagamento:
    build: ./Servicos/pagamentos
    container_name: servico_pagamento
    ports:
      - "8003:8000"
    networks:
      - rede_pagamento

networks:
  rede_catalogo:
    internal: true

  rede_pedidos:
    internal: true

  rede_pagamento:
    internal: true
