services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: message_broker
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rede_catalogo
      - rede_pedidos
      - rede_pagamentos
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  middleware:
    build: ./Middleware
    container_name: middleware
    ports:
      - "8000:8000"
    environment:
      CATALOGO_URL: http://catalogo:8000
      PEDIDOS_URL: http://pedidos:8000
      PAGAMENTOS_URL: http://pagamentos:8000
    depends_on:
      - catalogo
      - pedidos
      - pagamentos
    networks:
      - rede_catalogo
      - rede_pedidos
      - rede_pagamentos

  catalogo:
    build: ./Servicos/catalogo
    container_name: servico_catalogo
    ports:
      - "8001:8000"
    networks:
      - rede_catalogo

  pedidos:
    build: ./Servicos/pedidos
    container_name: servico_pedidos
    ports:
      - "8002:8000"
    networks:
      - rede_pedidos

  pagamento:
    build: ./Servicos/pagamentos
    container_name: servico_pagamento
    ports:
      - "8003:8000"
    networks:
      - rede_pagamento

networks:
  rede_catalogo:
    internal: true

  rede_pedidos:
    internal: true

  rede_pagamento:
    internal: true
